# TLS sozlamalari — barcha HTTPS serverlarga umumiy.
# Sertifikat YO'LLARI bu yerda emas: ular domen nomiga bog'liq va
# shablon (`templates/`) ichida yoziladi, chunki faqat o'sha yerda
# ${DOMAIN} almashadi.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling — brauzer sertifikat holatini tezroq tekshiradi
# ssl_stapling — Let's Encrypt OCSP to'xtatgan, ogohlantirish bermasin
ssl_stapling off;
ssl_stapling_verify off;
resolver 127.0.0.11 valid=30s;
resolver_timeout 5s;
