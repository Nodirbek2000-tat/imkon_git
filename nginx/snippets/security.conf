# Xavfsizlik sarlavhalari.

# HTTPS majburiy — bir marta kirgan brauzer keyin doim HTTPS ishlatadi.
# DIQQAT: bu sarlavha brauzerda 1 yil saqlanadi. Domenni HTTP'ga
# qaytarmoqchi bo'lsangiz oldin muddatni kamaytirib qo'ying.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Server versiyasini yashiramiz
server_tokens off;

# Siqish — matn fayllar uchun. Rasm/video allaqachon siqilgan.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/woff font/woff2;
